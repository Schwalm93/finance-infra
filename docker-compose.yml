services:
  traefik:
    image: traefik:v2.11
    container_name: finance-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=${TRAEFIK_DASHBOARD_INSECURE:-true}"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - finance-net
    restart: unless-stopped

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: finance-postgres-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mydb}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - finance-net
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    container_name: finance-backend
    environment:
      PORT: 8080
      DATABASE_CONNECTION_STRING: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-mydb}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-backend.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.finance-backend.priority=100"
      - "traefik.http.services.finance-backend.loadbalancer.server.port=8080"
    networks:
      - finance-net
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: finance-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.finance-frontend.priority=1"
      - "traefik.http.services.finance-frontend.loadbalancer.server.port=80"
    networks:
      - finance-net
    restart: unless-stopped

  pgweb:
    image: sosedoff/pgweb
    container_name: finance-pgweb
    profiles:
      - tools
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@db:5432/${POSTGRES_DB:-mydb}?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finance-net
    restart: unless-stopped

volumes:
  postgres-db-volume:

networks:
  finance-net:
    driver: bridge
